l_english:

### Haiti

HAI_haitian_revolution:0 "Haitian Revolutionary Spirit"
HAI_haitian_revolution_desc:0 "The Haitian People have endured much suffering but despite all, we have managed to come out on top. Invaided by the colonialist Americans in the First World War and then having a puppet administration forced upon us, we have managed to free ourselves from this supposed undefeatable giant. The people of Haiti live and die to see another day of freedom, no matter how great that cost may be..."

HAI_famine:0 "Famine"
HAI_famine_desc:0 "The American blockade on Haiti has caused the nation to go into a great famine. Most of the country is malnourished, or on the brink of death itself."

HAI_american_plot:0 "An American Plot?"
HAI_american_plot_desc:0 "The Americans wouldn't give up so easily. They must be plotting against the new government as we speak!"

nmbr_haiti.1.t:0 "The Glorious Haitian Revolution"
nmbr_haiti.1.d:0 "Haiti is a land of misery and depression. The first modern independent country in the Americas, Haiti has always been a land of people demanding freedom and liberation. Unfortunately, history hasn't been to kind to Haiti. Policital instability, famines, natural disasters, all of these have give Haiti the reputation of 'The Unluckiest Country'. Even more disasterously, during the Great War the United States lead an amphibious invasion to secure their economic interests in the region, and to grow the ever-expanding 'American Empire'. A puppet administration was established by the Yanks, and under it the Americans had a free reign over our resources and economy. That was until 1933. Like Namibia, Haiti had it's own glorious revolution against imperialism. Mino Bijoux was able to gather up a large army of Socialists and Nationalists where he then lead a coup against the puppet regime. A quick purge of all colaborators and Americans living in Haiti strengthened his rule as the one leader of Haiti. All this has come at cost however. The Americans are blockading our country and starving our people. Namibia is begining to rearm and lick it's wounds while Haiti is still stuck in the same position it was in 20 years ago. Will we be able to acheive our own dreams, or will we be forced to live under the shadows of the Namibians and Americans?"
nmbr_haiti.1.a:0 "L'Union fait la force!"

HAI_the_western_revolutionl:0 "The Western Revolution"
HAI_the_western_revolutionl_desc:0 "As Namibia and Zimbabwe had revolutions of their own, Haiti has also freed itself from White tyranny and has adopted the ideas of Uunona and M'seli. This puts us in the unique position of the first, and not last, Creole country in the Americas to adopt Pan-African Socialism."

HAI_fragile_elections:0 "Fragile Elections"
HAI_fragile_elections_desc:0 "Despite the nation being devoted to the revolution, the government is only holding on by a thread, and the fear of an American coup or invasion lingers. A quick old elections should lift up our moods... Right?"

HAI_premier_bijoux:0 "Premier Bijoux"
HAI_premier_bijoux_desc:0 "Successfully saving Haiti from an American counter-coup, Bijoux has won himself the spot as Premier of Haiti!"

HAI_fan_hatian_nationalism:0 "Fan Haitian Nationalism"
HAI_fan_hatian_nationalism_desc:0 "It is an honour to fight and an even greater one to die for Haiti and the Pan African Socialist cause."

HAI_national_mobilisation:0 "Mobilise Society"
HAI_national_mobilisation_desc:0 "The Yanks or Dominicans could strike at any moment! The whole of society must be prepared for a whole out war with these two nations in the future..."

HAI_fund_the_army:0 "Fund the Army"
HAI_fund_the_army_desc:0 "The army is what's keeping Bijoux in power. We must feed the greedy officers more money if we want to keep them satisfied."

HAI_saviour_of_haiti:0 "No Democracy in my Haiti!"
HAI_saviour_of_haiti_desc:0 "Democracy and elections is going to end the revolution. It's undoubtable that in any form of election, the Americans will interfere and rig it in their favour. We must purge democracy from Haiti if we want the Pan-African Socialist dream to live on!"

HAI_legacy_of_louverture:0 "Legacy of Louverture"
HAI_legacy_of_louverture_desc:0 "Just like Bijoux, Toussaint Louverture lead the glorious revolution against the European and White colonisers that were turning Haiti into a death camp. Bijoux has saved Haiti just like Toussaint Louverture, so his respect must be equal to his aswell!"

HAI_a_revolution_alike:0 "A Revolution Alike"
HAI_a_revolution_alike_desc:0 "The fury and rage our soldiers had during the Haitian Revolution must be emulated today. We won once, we'll win again!"

HAI_heirs_of_dessalines:0 "Heirs of Dessalines"
HAI_heirs_of_dessalines_desc:0 "Haiti was at it's greatest under it's various emperors. If we want Haiti to return to the world stage, a new emperor must be crowned! I know having a Socialist Monarchy sounds crazy, but it might just work!"

HAI_monarchist_restoration:0 "Monarchist Restoration"
HAI_monarchist_restoration_desc:0 "Despite being a right-wing republican, Joseph Faustin Soulouque has offered to be crowned as Faustin II! Long live Faustin II, Emperor of Pan-African Socialist Haiti!"

HAI_national_renewal:0 "National Renewal"
HAI_national_renewal_desc:0 "Haiti will step into the 20th century with glory and pride!"

HAI_imperial_nostalgia:0 "Imperial Navy"
HAI_imperial_nostalgia_desc:0 "Haiti must rebuild it's great navy if we want to build a new empire!"