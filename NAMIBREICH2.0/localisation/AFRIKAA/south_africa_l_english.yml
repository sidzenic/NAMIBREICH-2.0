nmbr_eswatini.2.t:0 "[ESW.GetName] Wishes to Purchase Swazi Bantustans"
nmbr_eswatini.2.d:0 "Eswainti wants to purchase the Swazi-dominated regions to the north of their country. Selling these lands would also give us one less minority to worry about."

nmbr_eswatini.3.t:0 "South Africa Agrees!"
nmbr_eswatini.3.d:0 "South Africa has agreed to the purchase of the northern territories. Despite the huge gain from this, our economy will be strained due to the reperations we owe South Africa for the time being."
