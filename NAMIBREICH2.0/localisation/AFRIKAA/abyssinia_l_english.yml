ETH_abyssinia_bank:0 "Abyssinia Bank"

ETH_economy_reforms:0 "Saving the Sinking Ship"
ETH_economy_reforms_desc:0 "Our deficit and debts have gotten out of hand. Our economy is barely able to function and one bad moment from crashing upon itself. We must start finding more ways to make more money and to save Abyssinia from this economic disaster!"

ETH_gemstone_mining:0 "Gemstone  Mining"
ETH_gemstone_mining_desc:0 "Abyssinia is well-famous for our gemstones and rare jewels. Selling these jewels would come in handy to help our debt problem."

ETH_jewlery:0 "Jewelry"
ETH_jewlery_desc:0 "Silversmiths and Jewelers are another staple of Abyssinia's craftmenship. We will try to compete with French and Italian jewelers, and spread our craft across the global market."

ETH_ethiopian_coffee:0 "Boost the Textiles Industry"
ETH_ethiopian_coffee_desc:0 "The textiles industry was booming before the great economic disaster. Maybe it's a good idea to restart the old textile engine... Do we even know what an engine is?"

ETH_meat_markets:0 "Meat Markets"
ETH_meat_markets_desc:0 "During the First World War Abyssinia found a good source of income by selling food to the Entente powers, especially beef, which became a luxurious item throughout the war. We will try to sell some more beef to the European powers to try and hit this goldmine again."

ETH_increase_agricultural_outputs:0 "Maximise Farm Output"
ETH_increase_agricultural_outputs_desc:0 "Too much food is wasted, which leads to us having to buy more food from our neighbours, making us in turn spend more money on useless things. The farmers will have to try better now, as no more food will be crossing into the border from now on!"

ETH_debt_bailout:0 "Debt Bailout"
ETH_debt_bailout_desc:0 "We may try our hardest, but our debt is such a burden it'd be impossible to get rid of it all. We will beg the foreign powers to forgive our debt."

ETH_gold_trade:0 "Gold Trade"
ETH_gold_trade_desc:0 "Abyssinia is legendary for their gold, right next to Ghana."

ETH_silk_trade:0 "Coffee Exports"
ETH_silk_trade_desc:0 ""

ETH_bank_of_ethiopia:0 "Bank of Abyssinia"
ETH_bank_of_ethiopia_desc:0 "A new fancy bank will be opened in Abyssinia! How does this help us? Who knows, it's just hoi4 logic."

ETH_rubber_plantations:0 "Rubber Plantations"
ETH_rubber_plantations_desc:0 "Rubber is an important resource for the Europeans powers. Selling land to Europeans powers for them to set up rubber plantations may not be a bad idea."

ETH_industralisation_effort:0 "Industrialisation Programme"
ETH_industralisation_effort_desc:0 "Practially everyone in the government agrees that Abyssinia needs to modernise. We cannot close our eyes and pretend the world is the same how it was 300 years ago. Abyssinia needs change, and it needs changes rapidly."

ETH_southerm_industrialisation:0 "Southern Development"
ETH_southerm_industrialisation_desc:0 "The Oromo have always been neglected by the old regime. We will show them our inclusiveness by developing their region."

ETH_north_industrialisation:0 "Northern Development"
ETH_north_industrialisation_desc:0 "The Wollo and Tigray region is our most strategically important. We must develope the region to further strengthen our possition in the region."

ETH_east_industrialisation:0 "Somali Development"
ETH_east_industrialisation_desc:0 "The Huwan was always seens as a wasteland with no potential. Although that may be true, we will atleast try to build something there."

ETH_uplift_the_capital:0 "Highland Development"
ETH_uplift_the_capital_desc:0 "The rural Gojjam and Gumuz have to developed aswell!"

ETH_connecting_eritrea:0 "Mdre Bahri Development"
ETH_connecting_eritrea_desc:0 "With Mdre Bahri under our control once more, we can begin developing the region!"

ETH_eritrean_shipping:0 "Massaua Dockyards"
ETH_eritrean_shipping_desc:0 "with Abyssinia finally connecting with the Sea we can now start preparing to build a proper navy!"

ETH_illiterate_populace:0 "Illiteracy Plague"
ETH_illiterate_populace_desc:0 "Most of Ethiopia cannot read or write. Years of higher education being locked behind wealth and noble ranking has caused most of the middle and lower class to be unable to access even basic education most of the time."

ETH_mass_corruption:0 "Mass Corruption"
ETH_mass_corruption_desc:0 "Corruption is practically a tradition in Abyssinian politics. Most of the generals and politicians are corrupt and are doing whatever makes them the most money, not doing what is right for Abyssinia."

ETH_selassie_idea:0 "Haile Selassie"
ETH_selassie_idea_desc:0 "A disgraced monarch, Selassie is seen by most as a weak and egoistic Emperor. Nowadays, he has found himself submitting to the new regime that uses him as their nice little puppet."

ETH_rejuvenate_the_arms_industry:0 "Rejuvenate the Arms Industry"
ETH_rejuvenate_the_arms_industry_desc:0 "Our weapons manufactories must be modernised!"

ETH_ethiopian_railway:0 "Connecting the Nation"
ETH_ethiopian_railway_desc:0 "It takes days for people to reach once place in Abyssinia to another. A national railway would fix the long journeys, along with also helping us move our soldiers around the country quicker."

ETH_pas_coup:0 "PASE Coup"
ETH_pas_coup_desc:0 "For too long have these right-wingers been destroying Abyssinia with useless wars and corruption. The Pan-African Socialist Party for Ethiopia will guide our Empire to glory, and we will join our African brothers down south in the anti-colonial struggle!"

ETH_uplift_rural_areas:0 "Uplift Poor Areas"
ETH_uplift_rural_areas_desc:0 "Most of Abyssinia is rural and poor. We must change this if we want the average Abyssinian to be equal in wealth and importance."

ETH_distribute_the_wealth:0 "Redistribute Wealth"
ETH_distribute_the_wealth_desc:0 "The wealth has been centralised for too long. The riches of the country has only been held by the army and those close to the emperor. We will force these corrupt goons to give it up, and give the Ethiopians what they deserve!"

ETH_unify_the_races:0 "Pan-African Schools"
ETH_unify_the_races_desc:0 " "

ETH_the_ethiopian_republic:0 "The Abyssinian Peoples' Republic"
ETH_the_ethiopian_republic_desc:0 "The monarchy's time has come. We will now be free to guide our own future without some lousy clergy men or monarchs stopping us!"

ETH_maintain_the_monarchy:0 "Maintain the Monarchy"
ETH_maintain_the_monarchy_desc:0 "As the previous government had done, the monarchy should remain as a usefull tool for the government to use. Outright ending the thousands of years old Solomic Monarchy would also be unacceptable to even some of the most anti-monarchists in the country."

ETH_socialist_agriculture:0 "New Agricultural Law"
ETH_socialist_agriculture_desc:0 "Too much is taxed from farmers by the state, resulting in shortages of food across the country. We will remove this tax, and allow our farmers to keep more of what they sow."

ETH_feed_the_mouths_of_many:0 "Feed the Mouths of Many"
ETH_feed_the_mouths_of_many_desc:0 ""

ETH_work_programme:0 "Work Programme"
ETH_work_programme_desc:0 "We must find jobs for the unemployed Abyssinians."

ETH_empower_unions:0 "Empower Unions"
ETH_empower_unions_desc:0 "We must strengthen the worker, so that they have greater power than their employers."

Ethiopia_nmb.4.t:0 "The Abyssinian-Namibian Economic Agreement"
Ethiopia_nmb.4.d:0 "An economic treaty has been signed by Namibia and Abyssinia to closer connect their economies, and to help eachother's economies grow. THE AMERICAN DOLLAR IS FINISHEDA"
Ethiopia_nmb.4.S:0 "Cheers!"

ETH_root_out_corruption:0 "Root out Corruptions"
ETH_root_out_corruption_desc:0 "Corruption has had the people at it's mercy for long enough! The old oligarchs are gone and so is their greedy ways of ruling!"

ETH_seize_royal_assets:0 "Seize Royal Assets"
ETH_seize_royal_assets_desc:0 "The Emperor was allowed to hoard too much wealth, without distributing it to the people. We will now use the money to better Abyssinia."

ETH_blessing_from_god:0 "Blessing From God"
ETH_blessing_from_god_desc:0 "The Socialist government is the divine ruler of Abyssinia. We will receive blessings from the church, and a free hand by the Emperor."

ETH_namibian_coprosperity:0 "Namibian Coprosperity"
ETH_namibian_coprosperity_desc:0 "Abyssinia must shine with Namibia. We must strike the the colonialist opressers and free Africa with our brothers down south."

ETH_fuel_pan_african_thinking:0 "African Science"
ETH_fuel_pan_african_thinking_desc:0 " "

ETH_nation_of_equals:0 "Nations of Equals"
ETH_nation_of_equals_desc:0 " "

ETH_cut_the_empire_in_two:0 "Cut the Empire in Two"
ETH_cut_the_empire_in_two_desc:0 "A strike into Sudan and into the supply routes would cripple colonialists' efforts in the Congo, helping our bogged-down allies in the south."

ETH_african_economic_alliances:0 "Economic Alliances"
ETH_african_economic_alliances_desc:0 "Namibia and Abyssinia must cooperate in building up our nations."

ETH_east_african_project:0 "Liberators of East Africa"
ETH_east_african_project_desc:0 " "

ETH_namibian_ethiopian_economic_alliance:0 "Namibian-Abyssinian Economic Cooperation Council"

ETH_monarchist_return:0 "Empowering the Monarchy"
ETH_monarchist_return_desc:0 "Abyssinia has gone too long without a strong monarch! The greedy Socialists and Nationalists have driven the country into the ground and disaster! We need a strong emperor to save Abyssinia at once!"

ETH_purge_the_socialists:0 "Socialists Purge"
ETH_purge_the_socialists_desc:0 "The So called Pan-African Socialists are a major threat to the monarchist movement and monarchy in general. Their leader will be trialed for treason and we will be able to sleep with one eye shut..."

ETH_purge_the_militarists:0 "Purge the Nationalists"
ETH_purge_the_militarists_desc:0 "The nationalists have brainwashed a large chunk of the army into blindly betraying Abyssinia and is a threat to the nation's security. We must assassinate the traitourous Haymanot and save Abyssinia from itself."

ETH_crown_the_negus:0 "Crown the Negus"
ETH_crown_the_negus_desc:0 "With the opposition purged, it's now safe to declare a new emperor over Abyssinia."

ETH_restore_the_council_of_advisors:0 "Restore the Council of Advisors"
ETH_restore_the_council_of_advisors_desc:0 "Menelik's Council of Advisors was proclaimed to guide Abyssinia during shakey rule and chaos. A similiar system must be put into place to divide the power and to avoid someone getting too strong in politics."

ETH_local_autonomy:0 "Local Autonomy"
ETH_local_autonomy_desc:0 "The Sultanate of Jimma, Aussa, Gojjam, the Huwan, all of these states existed to grant local autonomy in regions where Addis Ababa couldn't. We must grant more power to these rulers to help stabalise Abyssinia."

ETH_shared_power:0 "Rural Development"
ETH_shared_power_desc:0 "No benevolent leader would ignore his people's cry for development! We must build up the poverty ridden country side to appease to the people."

ETH_an_ethiopian_federation:0 "Democratic Investors"
ETH_an_ethiopian_federation_desc:0 "With us turning to democracy more and more by the day, more foreign powers are willing to help our little democratic African country develope."

ETH_an_absolute_monarch:0 "An Absolute Monarch"
ETH_an_absolute_monarch_desc:0 "Abyssinia's glories were in the days of divine and direct rulers. The Negus is God's willed ruler. No one else is smart enough or deserved to rule Abyssinia apart from him!"

ETH_gods_chosen:0 "God's Chosen"
ETH_gods_chosen_desc:0 "The Negus has been given the divine rule of God to lead Abyssinia into glory!"

ETH_heirs_of_menelik:0 "God of the Rastafarians"
ETH_heirs_of_menelik_desc:0 "Some crazy fells thinkg our Negus is a god or something... We'll take it!"

ETH_for_the_emperor:0 "Heirs of Menelik"
ETH_for_the_emperor_desc:0 "We are just like him fr. (I'm getting tired of writing these please forgive me )"

ETH_uplift_the_poor:0 "Uplift the Poor"
ETH_uplift_the_poor_desc:0 "The abuse and disregard for the lower classes were a major player in the overthrowing of Haile Selassie. If we want our monarchy to stick around, we must start paying attention to the poorer people of Abyssinia."

ETH_ethiopian_clean_up:0 "Abyssinian Clean-Up"
ETH_ethiopian_clean_up_desc:0 "No benevolent monarch would let his people suffer in the slums. We must raise the living standards across Abyssinia as a whole."

ETH_slavery_crackdown:0 "Slavery Crackdown"
ETH_slavery_crackdown_desc:0 "Abyssinia's slavery situation is a major restraint in us being accepted as a modern nation. We must crackdown on this inhumane act at once!"

ETH_promote_slavery:0 "Turn a Blind Eye"
ETH_promote_slavery_desc:0 "Slavery is what makes the Abyssinian economy unique. Anyways, where would the slaves even go if we let them all free?"

ETH_count_what_comes_in:0 "Count What Comes In"
ETH_count_what_comes_in_desc:0 "The income of the nation is never properly monitored, allowing for corruption to run rampant in tax collecting and other forms of the Abyssinian economy. We will keep a watchful eye on every figure in the government to make sure the embezzlement of funds ceases at once."

ETH_legacy_of_warriors:0 "Warrior Negus"
ETH_legacy_of_warriors_desc:0 "Abyssinia's greatest victories were battles commanded by the Negus themself. If we want to repeat said victories, we must ask the Negus to lead our men to battle personally!"

ETH_land_reform:0 "Land Reform"
ETH_land_reform_desc:0 "Too much land is owned by the rich and corrupt members of society. We will appease to the peasants and farmers by giving them more land to live and work on."

Ethiopia_nmb.1.t:0 "Capture and Execution of Desta Damtew"
Ethiopia_nmb.1.d:0 "While visting the Northern frontline, Desta Damtew has been captures by Italian soldiers after an ambush. His current whereabouts are unknown, but visual reports claim seeing his body being thrown into a local river. It's most likely that he's dead, and legendary war hero Balcha Safo will take emergency powers until time tells what will happen in the future."
Ethiopia_nmb.1.a:0 "We're not dead yet!"

ETH_continue_modernisation:0 "Continue Modernisation"
ETH_continue_modernisation_desc:0 "If there was one thing the Junta did right, it was to continue our modernisation attempts. We will continue to bring Abyssinia into the West and out of it's medieval traditions."

ETH_church_schooling:0 "Church Schooling"
ETH_church_schooling_desc:0 "The Church has a great influence over the state and politics of the country. Requesting them to educate our people could save us some money and would also push the children into following our beleifs."

ETH_menelik_univeristy:0 "Menelik University"
ETH_menelik_univeristy_desc:0 " "

ETH_more_chruches:0 "Fund Church Programmes"
ETH_more_chruches_desc:0 "We must build more churches and places of worship across the country."

ETH_royal_arms:0 "Royal Arms"
ETH_royal_arms_desc:0 "The Negus has decided to take some money out of his personal funds to purchase more weapons in these trying times."

ETH_flat_tax:0 "Flat Tax"
ETH_flat_tax_desc:0 "We must implement Haile Selassie's old tax reform to increase our income"

ETH_fake_event_embargo:0 "The British Will be Forced to Lift Their Embargo"

Ethiopia_nmb.5.t:0 "Crowning of the Emperor"
Ethiopia_nmb.5.d:0 "The question now arises; who shall be proclaimed as the Emperor of Abyssinia? Some wish to grant Haile Selassie full power to rule Abyssinia again, stating that it was external forces that turned Abyssinia into a mess and us winning the war against Italy has just further strengthened our position. Although, the common census is that Haile Selassie is an incompetant leader who should never touch the throne again and that his son, Amha Selassie, should be crowned instead. There is a third option, however. Uncrowned emperor Lij Iyasu has remained locked up in his cell since 1917 after Haile Selassie couped him. He was known as a reformer and an anti-imperialists, the one man who could save Abyssinia. Haile Selassie ordered his execution, but after the coup in 1935 it was called off. Does Iyasu have the right to rule the throne?"
Ethiopia_nmb.5.a:0 "Haile Selassie I!"
Ethiopia_nmb.5.b:0 "Haile Selassie II!"
Ethiopia_nmb.5.c:0 "Iyasu V!"

Ethiopia_nmb.3.t:0 "African Aid Arives"
Ethiopia_nmb.3.d:0 "With the British being forced to end their blockade on Abyssinia, Namibia, Zimbabwe and Angola have all sent an influx of weapons to help our cause against the Italians! The unity of our African nations only grows!"
Ethiopia_nmb.3.a:0 "Cheers!"