l_english:

######## ETHIOPIA

ETH_backwards_army:0 "Backwards Army"
ETH_backwards_army_desc:0 "Abyssinia's army hasn't changed much since the First Italo-Ethiopian War. Most modernisation attempts have ended up doing nothing for the army, but plenty for the Ras and Nobility. Why spend thousands on the army when one can use that money on a fancy new Abyssinian home?"

ETH_christmas_offensive:0 "Christmas Offensive"
ETH_christmas_offensive_desc:0 "The Christmas Offensive is a defensive-offence started to counter the Italian attacks in the North of the country."

ETH_legacy_of_the_1930_coup:0 "Legacy of the 1935 Coup"
ETH_legacy_of_the_1930_coup_desc:0 "Haile Selassie made countless blunders and nearly lead Abyssinia to the grave with a pointless war against Italy. Militarist, democratic, reformists and Pan-African Socialist factions all agreed to coup the government and to limit the Emperor's power. Although it was said to the nation that these emergency powers would conclude once the War with Italy was over, most agree that it would be foolish to let Abyssinia fall into the hands of the incompetant Selassie once more."

ETH_primative_economy:0 "Paralysing Debt"
ETH_primative_economy_desc:0 "Haile Selassie took in lots of foreign loans to help modernise Abyssinia, hoping to pay the Europeans back once the fruits of modernisating started to show, and Abyssinia would develope a great and modern economy. This ended in utter failure. Corruption and incompetance resulted in Abyssinia ending up with tonnes of debt, and nothing to show of it's reforms."

ETH_primative_economy2:0 "Paralysing Debt"
ETH_primative_economy2_desc:0 "Haile Selassie took in lots of foreign loans to help modernise Abyssinia, hoping to pay the Europeans back once the fruits of modernisating started to show, and Abyssinia would develope a great and modern economy. This ended in utter failure. Corruption and incompetance resulted in Abyssinia ending up with tonnes of debt, and nothing to show of it's reforms."

