 # Bookmark
 
 NMB_GATHERING_STORM_DESC:0 "Colonised by the Germans in the 19th Century, Namibia found itself being fought over by the Germans and South Africans in the First World War. The Namibian people saw this opportunity and revolted, only to end up being invaded by South Africa in 1916. South Africa was forced to pull out of Namibia in 1926, ending the 10-year-long occupation./n/n Economic depression, high unemployment and bitter memories of recent occupation, lead to Hitler's coup of the democratic republic in 1933. Will Hitler be able to bring Namibia into a new age, or succumb to the chaos that surrounds the land?"

 
