NMB_german_support2:0 "Support of the White Minority"
NMB_german_support3:0 "Support of the White Minority"
NMB_german_support4:0 "Support of the White Minority"
NMB_german_support5:0 "Support of the White Minority"



NMBdemocratic_an_army_to_compete_with_south_africa:0 "A Modern Army to Compete with South Africa"
NMBdemocratic_an_army_to_compete_with_south_africa_desc:0 "To compete with our much stronger enemies, we must innovate and fill our army with all sorts of new technology. South Africa looks to be quite slow on modernising their army, so we should be able to outpace them with ease."

NMBdemocratic_import_foreign_tech:0 "Import Light Tanks"
NMBdemocratic_import_foreign_tech_desc:0 "We cannot produce our own light tanks as of now, so we will instead purchase some old tanks off Germany to begin building up our armour divisions."

NMBdemocratic_well_equiped_army:0 "Light Tank Production"
NMBdemocratic_well_equiped_army_desc:0 "We will open new factories for the sole purpose of building light tanks to further strengthen our army."

NMBdemocratic_quality_over_quantity:0 "Quality Over Quantity"
NMBdemocratic_quality_over_quantity_desc:0 "A few hundred tanks could easily piece through South Africa's defenses opposed to a hundred-thousand armed spearmen. We will focus on produce small-scaled divisions capable to defeating our enemies from now on."

NMBdemocratic_fear_the_panzer:0 "Fear the Panzer"
NMBdemocratic_fear_the_panzer_desc:0 "The world has been shown the true power of tanks, and we shall harvest it!"

NMBdemocratic_manpower_drive:0 "Manpower Drive"
NMBdemocratic_manpower_drive_desc:0 "Namibia is lightly populated, and it will be hard to build a large army due to it. We must squeeze out every last drop of of manpower out of our population to fullfill our army's needs."

NMBdemocratic_promote_army_diversity:0 "Promote Army Diversity"
NMBdemocratic_promote_army_diversity_desc:0 "Half of the army's white generals are heavily opposed to the recruitment of black generals and officers. We will tell these generals to shut up and accept the help they are being offered."

NMBdemocratic_conscript_the_basters:0 "Conscript the Basters"
NMBdemocratic_conscript_the_basters_desc:0 "The Basters have enjoyed their privleges and have lazed around doing nothing for too long. It's time for them to get on their feet and to serve Namibia."

NMBdemocratic_volksturm:0 "Volksturm"
NMBdemocratic_volksturm_desc:0 "Hitler has proposed a new branch of the army, the Volksturm. The peoples' army is going to have it's ranked filled by underaged child soldiers and 80 year old men. What a great idea!"

NMBdemocratic_mobilise_boy_scouts:0 "Mobilise the Boy Scouts"
NMBdemocratic_mobilise_boy_scouts_desc:0 "There are dozens of German and Namibian boy scouts in the country. We will grant the scouts a new 'opportunity' by joining the army and showing them the fun of war."

NMBdemocratic_conscript_germans:0 "Conscript Germans"
NMBdemocratic_conscript_germans_desc:0 "The Germans have been conscripting Africans to fight for them for too long! It's time to force the conscription of German settlers to fight side-by-side with their African brothers."

NMBdemocratic_tribal_participation:0 "Tribal Participation"
NMBdemocratic_tribal_participation_desc:0 "It's time to halt the tribes from living their nomadic lifestyle, and force them to join the army."

NMBdemocratic_tswana_conscription:0 "Tswana Conscription"
NMBdemocratic_tswana_conscription_desc:0 "The Tswana are now under our control, and we will extend our conscript policy to their lands."

NMBdemocratic_afrikaaner_conscription:0 "Afrikaaner Conscription"
NMBdemocratic_afrikaaner_conscription_desc:0 "Thousands of Black South Africans have volunteered to fight for Africa with us. Join up, boys!"

NMBdemocratic_boer_recruitment:0 "Boer Recruitment"
NMBdemocratic_boer_recruitment_desc:0 "We will now force the white-supremist Boers to fight for us, as payback for all that slavery stuff they've done before!"

NMBdemocratic_special_forces:0 "Special Forces"
NMBdemocratic_special_forces_desc:0 "We must train some special forces to expand our combat capabilites."

NMBdemocratic_mountain_people:0 "Mountain Training"
NMBdemocratic_mountain_people_desc:0 "South Africa is home to many mountains. Mountains that we will have to conquer in the upcoming future. We must invest into mountaineers to assure that South Africa will not be able to hide on their little mountains should war break out!"

NMBdemocratic_desert_surivial_missions:0 "Desert Survival Missions"
NMBdemocratic_desert_surivial_missions_desc:0 "Namibia is home of the oldest desert in the world. We will train our soldiers to not only surivive in the desert, but to thrive in it! (Was that cool?)"

NMBdemocratic_form_the_fallschirmjager:0 "Paratroopers"
NMBdemocratic_form_the_fallschirmjager_desc:0 "The modern age has brought us another wonderful invetion; Paratroopers!"

NMBdemocratic_building_an_airforce:0 "Building an Airforce"
NMBdemocratic_building_an_airforce_desc:0 "Hitler has always dreamt of Namibia ruling the skies... and the stars. Since spaceships don't exist yet, we will have to be happy with only owning the skies for now..."

NMBdemocratic_windhoek_airport:0 "Windhoek Airport"
NMBdemocratic_windhoek_airport_desc:0 "Namibia doesn't have any airport or even a basic landing strip in it. We must open Windhoek International to house our new airforce."

NMBdemocratic_import_early_fighters:0 "Steal South African Designs"
NMBdemocratic_import_early_fighters_desc:0 "By hiring some professional theives, we can steal some South African plane designs to begin building up our airforce's numbers."

NMBdemocratic_begin_producing_planes:0 "Begin Producing Planes"
NMBdemocratic_begin_producing_planes_desc:0 " "

NMBdemocratic_german_licensing:0 "Big Boom!"
NMBdemocratic_german_licensing_desc:0 " "

NMBdemocratic_fighter_tech:0 "Fighter Tech"
NMBdemocratic_fighter_tech_desc:0 " "

NMBdemocratic_namibian_bombers:0 "Namibian Bombers"
NMBdemocratic_namibian_bombers_desc:0 " "

NMBdemocratic_state_funded_worker_unions:0 "State Protected Unions"
NMBdemocratic_state_funded_worker_unions_desc:0 "Workers must be allowed to unionise and protect their rights if they feel like they are being abused by their employers. We will crack down on companies opressing their workers, and will motive abused workers to speak out against these brutal companies that only care about money!"

NMBdemocratic_the_namibian_army:0 "The Namibian Army"
NMBdemocratic_the_namibian_army_desc:0 "The army is in total ruins. Most of the funds of the army were kept by oligarchs during the Republican Era, but now with Hitler in charge, the army can finally get the love it deserves!"

NMBdemocratic_legacy_of_the_resistance_war:0 "Legacy of the Resistance War"
NMBdemocratic_legacy_of_segregartion_desc:0 "Coined by Hitler, the 'Great Resistance War' was the period inbetween 1916 and 1926 where brave Namibian fought the South African invaiders. We eventually succeeded, but at a great cost. We must modernise the army if we don't want our nation to at the mercy of South Africa again."

NMBdemocratic_german_army_plan:0 "German Army Plan"
NMBdemocratic_german_army_plan_desc:0 "The Germans in our army are some of the best fighters and strategists we have to offer. We must listen to their suggestions if we want a competant army."

NMBdemocratic_increase_training_standards:0 "Increase Army Standards"
NMBdemocratic_increase_training_standards_desc:0 "A good army is a strict, loyal and professional one. Right now our army is full of vagabonds that only serve us for their paycheck at the end of the month. We must motivate our soldiers to fight for Namibia, not for the money."

NMBdemocratic_integrate_artillery_into_the_army:0 "Improve Artillery"
NMBdemocratic_integrate_artillery_into_the_army_desc:0 "Artillery is what will win us the war. The Germans in the First World War showed the world how important large cannons are in modern warfare. We don't need some silly modern tanks or cars, all we need is the good ol' howitzer."

NMBdemocratic_finnish_advisors:0 "Finnish Advisors"
NMBdemocratic_finnish_advisors_desc:0 "Finland has a suprisingly deep history with Namibia. During the colonial years hundreds of Finns migrated to Namibia and during our independence war, Finnish officials voally supported our cause. They have now offered to send us some advisors to help modernise the army, which we will accept."

NMBdemocratic_legacy_of_lettow_vorbeck:0 "Legacy of Lettow-Vorbeck"
NMBdemocratic_legacy_of_lettow_vorbeck_desc:0 "Paul von Lettow-Vorbeck is arguebly the greatest general of the First World War. Claiming no defeat, he was able to survive longer in East Africa with a few thousand ascari than mainland Germany itself. If Vorbeck could pull of such a great victory, than so can we!"

NMBdemocratic_finnish_generals:0 "Finnish Generals"
NMBdemocratic_finnish_advisors_desc:0 " "

NMBdemocratic_prussian_army1:0 "Prussian-Styled Army"
NMBdemocratic_prussian_army1_desc:0 "The Germans may be racist to us, hate us with all of their guts, and wish to reoccupy us, but alteast they know how to fight!"

NMBdemocratic_prussian_army2:0 "Prussian-Styled Army"
NMBdemocratic_prussian_army2_desc:0 "The Germans may be racist to us, hate us with all of their guts, and wish to reoccupy us, but alteast they know how to fight!"

NMBdemocratic_namib_blitzkreig:0 "Namib Blitzkreig"
NMBdemocratic_namib_blitzkreig_desc:0 " "

