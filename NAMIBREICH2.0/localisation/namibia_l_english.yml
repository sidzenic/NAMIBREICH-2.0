NMG_political_hellhole:0 "Political Hellhole"
NMG_political_hellhole_desc:0 "SWAPO members, German imperialists, the various flavours of Afrikaaners and Boers, Anglo nationtionalists, black supremistis and fleeing political figures from Namibia all end up in the Walvis Bay, all fighting one another while tearing themselves down."

NMB_colonial_conscripts:0 "Colonial Concsriptions"
NMB_colonial_conscripts_desc:0 "The African conscripts are 'hired' to defend the city when crisis looms."