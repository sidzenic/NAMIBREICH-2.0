 # Events
 
 namibia.1.t:0 "Meinland Remilitarized"
 namibia.1.d:0 "The Namibian army has marched into the previously demilitarized zone of Meinland. They were unopposed and Adolf Hitler has called for celebration!"
 namibia.1.a:0 "Great!"
 namibia.2.t:0 "Anschluss"
 namibia.2.d:0 "The nation of Botswana has been integrated into our country. Our two peoples will work together to further our goals of African dominance."
 namibia.2.a:0 "Welcome Brothers"
 namibia.3.t:0 "Eastern Claims"
 namibia.3.d:0 "Britain has given in and handed over the territory of Rhodesia. This has proven our strength to the world. Perhaps its time for further expansion as the old powers submit to us."
 namibia.3.a:0 "Britain Folds"
 namibia.4.t:0 "Cape Town or War"
 namibia.4.d:0 "A telegram was sent to the president of South Africa with our demands. A response arrived this morning, they have declined! No other options remain, we must go to war immediately!"
 namibia.4.a:0 "To arms!"
 namibia.5.t:0 "Demands Met"
 namibia.5.d:0 "The Portugese have handed over their former colony of Angola to us. With this our nation has gained another 3 million people, the administering of them will prove difficult."
 namibia.5.a:0 "We Did It!"
 namibia.6.t:0 "The African Uprising"
 namibia.6.d:0 "The people of western Africa have flocked under the banner of Liberia and fascism. Their power can no longer be ignored, we must ally ourselves with them!"
 namibia.6.a:0 "Our Numbers Grow"
 namibia.7.t:0 "The Greater Reich"
 namibia.7.d:0 "Adolf Hitler had announced joyfully today that his innermost dream of dominating southern Africa has come true. What awaits us in the future is yet to be seen!"
 namibia.7.a:0 "We Have Risen!"
 namibia.8.t:0 "The Second Uprising"
 namibia.8.d:0 "The People of Chad have seen reason and joined our fight against their colonial overlords!"
 namibia.8.a:0 "Godspeed Brothers"
 
 namibia_news.1.t:0 "Adolf Hitler Conquers the World"
 namibia_news.1.d:0 "After a long fought war Adolf Hitler can finally be at ease as he has completed his ultimate goal of world conquest. The Namibian people rejoice in their new role as world leaders. Yet their ambitions are not yet quenched as they set their sights for the stars."
 namibia_news.1.a:0 "Long Live Adolf Hitler!"
 namibia_news.2.t:0 "Adolf Hitler Unites Africa"
 namibia_news.2.d:0 "The reign of all African colonial empires come to an end as the valiant Adolf Hitler has managed to unite the entire continent of Africa under an independent government. What his next plans are is still unknown but the rest of the world waits with held breath."
 namibia_news.2.a:0 "Holy Shit!"
 
 # Focus
 
 NMB_four_year_plan:0 "Four Year Plan"
 NMB_four_year_plan_desc:0 ""
