 NMB_naval_effort2:0 "Expand Dockyard Facilities"
 NMB_naval_effort2_desc:0 ""
 NMB_tactical_air_effort:0 "Tactical Air Effort"
 NMB_tactical_air_effort_desc:0 "Victory will be achieved by annihilating the enemy's ground forces. We must focus on supporting our own armies with tactical strikes against close and deep targets."
 NMB_long_range_escorts:0 "Long-Range Escorts"
 NMB_long_range_escorts_desc:0 "Our tactical and strategic bombers require longer-range escorts to provide protection all the way to the target area and back."
 NMB_strategic_air_effort:0 "Strategic Air Effort"
 NMB_strategic_air_effort_desc:0 "Victory will be achieved by destroying the enemy's industries. We must focus our efforts on design and production of strategic bombers."
 NMB_army_innovation:0 "Army Innovations"
 NMB_army_innovation_desc:1 ""
 NMB_air_innovation_2:0 "Air Innovations II"
 NMB_air_innovation_2_desc:0 "The tasks of the Reich's Air Ministry are of paramount importance. The Luftwaffe must be the most advanced Air Force in the world!"
 NMB_army_innovation_2:0 "Army Innovations II"
 NMB_army_innovation_2_desc:0 ""
 NMB_rocketry_focus:0 "Rocketry"
 NMB_rocketry_focus_desc:0 "Rocket propulsion holds the key to massive innovations in all three of the military branches."
 NMB_wunderwaffe:0 "Wunderwaffe"
 NMB_wunderwaffe_desc:0 ""
 NMB_rhineland:0 "Meinland"
 NMB_rhineland_desc:0 "Adolf Hitler has jokingly started referring to southern Namibia as Meinland. The patch of land is disputed between us and the South Africans and the English have ordered it to be demilitarized, this changes today!"
 NMB_anschluss:0 "Anschluss"
 NMB_anschluss_desc:0 "The Anschluss, or union with Botswana, is a long held goal of the Namibian people. The time has finally come to bring it about. Let us offer them a chance at sharing our glorious destiny!"
 NMB_demand_memel:0 "Assert Eastern Claims"
 NMB_demand_memel_desc:0 "Rhodesia should be considered part of our Reich as it would cement our eastern border. The British must be pushed to handing it over!"
 NMB_danzig_or_war:0 "Cape Town or War"
 NMB_danzig_or_war_desc:0 "Adolf Hitler has set his sight on cape town in order to expand his empire, yet the British are not as eager to give it away. If we must take it by force let it be so."
 NMB_demand_sudetenland:0 "Demand South Angola"
 NMB_demand_sudetenland_desc:0 "The fate of the Angolans is up to us. They must be brought under our protection, regardless of Portugese objections."
 NMB_first_vienna_award:0 "First African Uprising"
 NMB_first_vienna_award_desc:0 "The Liberians too have seen the guiding light of Adolf Hitler's ideology. They must join us in our world conquest! We will inspire their neighbours to join us too!"
 NMB_reintegrate_luxemburg_and_alsace_lorraine:0 "Announce the Greater Namibian Reich"
 NMB_reintegrate_luxemburg_and_alsace_lorraine_desc:0 "With our successful conquest of Southern Africa we must move to integrate the peoples in order to compete with our large enemies!"
 NMB_naval_rearmament:0 "Naval Rearmament"
 NMB_naval_rearmament_desc:0 ""
 NMB_u_boat_effort:0 "U-Boat Effort"
 NMB_u_boat_effort_desc:0 ""
 NMB_trade_interdiction:0 "Trade Interdiction"
 NMB_trade_interdiction_desc:0 "Our dockyards are committed to churning out U-boats, but we need to develop better ways of utilizing these 'wolf packs'. Give the admirals everything they need to conduct their simulations and war games..."
 NMB_modular_construction:0 "Modular Construction"
 NMB_modular_construction_desc:0 "By having parts of our submarines built at various construction facilities, assembly and construction speed are greatly improved."
 NMB_synthetic_rubber:0 "Synthetic Rubber"
 NMB_synthetic_rubber_desc:0 ""
 NMB_hermann_goring_werke:0 "Adolf Hitler Werke"
 NMB_hermann_goring_werke_desc:0 ""
 NMB_kdf_wagen:0 "Adolf Hitler Wagen"
 NMB_kdf_wagen_desc:0 ""
 NMB_around_maginot:0 "Into the Congo"
 NMB_around_maginot_desc:0 ""
 NMB_weserubung:0 "Finish off the Portugese"
 NMB_weserubung_desc:0 ""
 NMB_all_in:0 "All In"
 NMB_all_in_desc:0 ""
 NMB_war_machine:0 "War Machine"
 NMB_war_machine_desc:0 "War Machine"
 NMB_tomorrow_the_world:0 "Tomorrow the World"
 NMB_tomorrow_the_world_desc:0 "Tomorrow the World"
 NMB_second_vienna_award:0 "Second African Uprising"
 NMB_second_vienna_award_desc:0 "We must inspire Africans in the north to join our cause."
 NMB_world_is_ours:0 "The World is Ours"
 NMB_world_is_ours_desc:0 "We have done what Adolf Hitler set out to do. Conquering the world in the name of Namibia. Long may our glorious leader live!"
 NMB_annex_allies:0 "Annex Allies"
 NMB_annex_allies_desc:0 "Our weaker allies have outgrown their usefulness, its time we bring them into our empire."
 NMB_integrate_africa:0 "Integrate Africa"
 NMB_integrate_africa_desc:0 "With our recent conquests we must move to integrate the African people who live in our new territories"
 NMB_birth_program:0 "Birth Program"
 NMB_birth_program_desc:0 "Adolf Hitler needs more people for his grand conquest. All Namibians have a duty to the state to provide new sons and daughters for the effort."
 NMB_immigration_I:0 "Rural Immigration"
 NMB_immigration_I_desc:0 ""
 NMB_immigration_II: "Urban Immigration"
 NMB_immigration_II_desc: ""
 NMB_bot_eco:0 "Botswanan Arms Industry"
 NMB_bot_eco_desc:0 "We must set up arms factories in our newly conquered lands to ensure were ready for war."
 NMB_immigration_III:0 "Botswanan Immigration"
 NMB_immigration_III_desc:0 ""
 NMB_steel_prod:0 "Namibian Excavation"
 NMB_steel_prod_desc:0 "We must secure access to various natural resources inorder to fuel our war effort."
 NMB_tung_prod:0 "Tungsten Excavation"
 NMB_tung_prod_desc:0 "We need Tungsten for our artillery pieces. Good thing a new deposit has been found in the Namibian Dong."
 NMB_alu_prod:0 "Aluminium Mines"
 NMB_alu_prod_desc:0 "Aluminium is another vital metal for our industry. We will begin mining for it in Southern Namibia."
 NMB_bot_steel:0 "Botswanan Steel"
 NMB_bot_steel_desc:0 "By exploiting our new lands in Botswana we can gain more steel for guns."
 NMB_rho_eco:0 "Rhodesian Factories"
 NMB_rho_eco_desc:0 "Expanding our industrial capabilites in Rhodesia will be a great step in making them see the light of Adolf Hitlers Ideology."
 NMB_denounce_false:0 "Denounce the False Axis"
 NMB_denounce_false_desc:0 "Adolf Hitler in Germany is nothing like our great leader, we must denounce his actions and make sure he surrenders to our might."
 NMB_denounce_ita:0 "Liberate Ethiopia"
 NMB_denounce_ita_desc:0 "The incompetent Italians hold on to rightful african territories, we must strike them now!"
 NMB_african_construction:0 "African Construction"
 NMB_african_construction_desc:0 "The lands of Africa are vast yet we find it hard to industrialise in the rugged terrain. We must develop techniques to overcome these problems."
 NMB_cog_eco:0 "Develop the Congo"
 NMB_cog_eco_desc:0 "The Congo is vast and we would do well in developing it's lands to fit our industrial needs."
 NMB_saf_eco:0 "Develop South Africa"
 NMB_saf_eco_desc:0 "South Africa is already quite develop in comparison to the rest of Africa but more could be done."

 #### ZIMBABWE

 ZIM_GATHERING_STORM_DESC:0 "Zimbabwe is a land of deep and rich history, but the modern times hasn't been to kind to them. Zimbabwe was promised the whole of Africa for joining the Great War on the side of the Entente, but at the table of Versailles, the other countries just mocked the King of Zimbabwe for sending tribesmen to the Western Front. This left the people of Zimbabwe furious, and shortly after Bentu M'seli conducted his 'March on Harare' couping the monarchy and promising to restore Great Zimbabwe. Will M'seli and Hitler join forces and free Africa? Find out in the next episode of LARP!"

 ZIM_dzuda_ii:0 "Dzuda II"
 ZIM_dzuda_ii_desc:0 "His Majesty Dzuda II is the current king of the Mutapa Empire, and the proclaimed Emperor of Great Zimbabwe."

 ZIM_great_zimbabwe:0 "Great Zimbabwe"
 ZIM_great_zimbabwe_desc:0 "Bentu M'seli has one wish and dream; The re-creation of Great Zimbabwe. The Allies made a great mistake not granting the whole of Africa to Zimbabwe, and now they must be left at the end of our sword begging for mercy! Long live the King! Long life Great Zimbabwe!"

 ZIM_war_exhaustion:0 "War Exhaustion"
 ZIM_war_exhaustion_desc:0 "As M'seli calls it 'The War to Reclaim our Lost Northern Provinces', the war with Zambia has lasted since 1933 and has been a constant stalemate over the Zambezi river with both sides suffering heavy casulties. The population has gotten more than tried of this pointless war, and if a conclusion isn't to be reach, M'seli could very well lose his mantle..."

namibia.9.t:0 "Namibia Demands our Land!"
namibia.9.d:0 "The Namib Reich has demanded the land of the Namibian Dong and some Southern Territories, claiming it to be historical territory ripped away from the Namibian People during the Great Resistance War. South Africa has also shown zero interests in protecting us. What shall we do?"
namibia.9.a:0 "We Must Give in..."
namibia.9.b:0 "Over my Dead Body!"

namibia.10.t:0 "Botswana Caves in!"
namibia.10.d:0 "Botswana has surrended the Dong and Thing to us. Even better, their allies have shown zero care about their future! Talks are already begining inbetween us and Zimbabwe and on what comes next..."
namibia.10.a:0 "Another Victory of Hitler!"

namibia.11.t:0 "German Officer Question"
namibia.11.d:0 "Either seen as a plague or blessing, many ethnic Germans generals from the Great War have their own positions in the army. Unfortunately, this also means they have great say over Namibian politics, and many anti-racist and Pan-African laws have been put to a halt by them. Hitler has to make the hard decision to purge the Germans out of the army, or let them stay. Can we really win a war agaisnt South Africa without any real military knowledge?"
namibia.11.a:0 "Auf Wiedersehen!"
namibia.11.b:0 "Let's Just Bribe Them so They all Shut up!"

namibia.12.t:0 "Namibia Demands the Walvis Bay Territory!"
namibia.12.d:0 "Namibia has demanded the immediate handover of the Walvis Bay Territory to them. Most of the army has surrounded Walvis and our northern border eager to fight. It looks like that even if we accept these demands, the Namibians will try to find another excuse to attack us..."
namibia.12.a:0 "We Won't Surrender so Easy, Adolf!"
namibia.12.c:0 "We Need More Time to Prepare! You win This Time, Adolf!"

namibia.13.t:0 "South Africa Refuses!"
namibia.13.d:0 "The ignorant South Africans have refused to hand over our rightful and indigenous lands of the Walvis Bay to us! The only right thing to do now is to prepare the army, and tell the world that South Africa's liberation from the whitemen is near!"
namibia.13.a:0 "To Cape Town we go!"

namibia.14.t:0 "Fate of Botswana"
namibia.14.d:0 "Gabrone has ordered all of it's men to stand down, as Namibian and Zimbabwean soldiers march across the nation, carving out sphere of influence in their country. Botswana's lame existance ends today, and Namibia rises like a phoenix from the ashes!"
namibia.14.a:0 "We Will Conquer All!"

namibia.17.t:0 "1936 Official Pan-African Congress"
namibia.17.d:0 "Since Uunona's rise, three Pan-African congresses have taken place. Invitations to all Pan-African Socialist organisations and African alike are sent to attend this meeting taking place in Windhoek, the Namibian capital. Spokespersons from Liberia, Ethiopia, Botswana, Zambia, Angola, various speakers from African-decendent peoples in the Carribean and the Prime Minister of Zimbabwer, Bentu M'seli have all arrived in Windhoek to discuss the future of the African peoples across the world. As typical, South Africa, France and England have all spoken against this meeting, labeling it as a 'terrorist organisation' and inciters of violence. Still, we have many things to talk about, so let's get talking!"
namibia.17.a:0 "For a Brighter, Redder and Blacker Africa!"

namibia.18.t:0 "Spokesperson - Kingdom of Zimbabwe"
namibia.18.d:0 "Prime Minister Bentu M'seli of the Kingdom of Zimbabwe is the first to speak. M'seli is one of the 'father figures' of Pan-African Socialism, with him and Uunona funding countless organisation across Africa, and helping millions against the anti-colonial struggle. 'We are meeting today to reaffirm our commitment to the Pan-African Socialist struggle and, in particular, to its comprehensive agenda for the promotion of peace and security, sustainable development and human rights. We are, however, concerned that the world today continues to witness unbridled acts of aggression, wars, conflicts, terrorism and rising levels of poverty. The Fascists' invaison of our greatest brother, Ethiopia. France's crimes in Central Africa and the continued genocide in the Congo. We are also alarmed that powerful states, which daily preach peace and good governance continue to trample with impunity upon the sovereignty of poor and weak nations. Zimbabwe yearns for a community of nations that recognises and respects the sovereign equality of all nations, big and small, in accordance with the Charter of Pan-African Socialist ideals. We all have positive roles to play in promoting peace and development for the benefit of present and future generations."
namibia.18.a:0 "A Hero we can all admire..."

namibia.19.t:0 "Ethiopia"
namibia.19.d:0 "The first Pan-African Socialist Congress since the invasion of Ethiopia has been tense. Various nations have their hearts bleeding for the Abyssinian cause, but it is near-to-impossible for any country to send military aid to Ethiopia. The United Kingdom has prevented any arms deal of any sorts from passing through it's colonies, and we have been forced to sit and wait for Ethiopia to hopefully dig in and defeat the Italians once more. Every general of ours beleive an Italian victory is near impossible, and that this war will show to the world the will of the African people, and that this will be another shining example of the African spirit! The Pan-African Socialist party in Ethiopia is also rapidly growing in popularity, and once Ethiopia is victorious, they will hopefully gain power and we will gain a newfound ally! Well, assuming they'll turn out on top... right?"
namibia.19.a:0 "We can only pray"

namibia.20.t:0 "Angola"
namibia.20.d:0 "Angola has remained a close like-minded friend of Namibia and Zimbabwe. Although Angola has pledge fulled neutrality and isn't as hated by the West as we are, they still remain as a possible landing ground for any future infiltrations of the Congo or French Africa. Despite this, with the Pan-African Socialist Party of Angola (PASPA) making various political blunders, and corruption going on through the nation like wildfire, the question has occured ~ Is Angola worth keeping? Although friendly towards us, a sudden coup or threat from the outsiders, Angola could turn into an enemy quick. Some generals have even made the call to invaide Angola right now, to avoide any future hassle. Still, we're far to weak to try and attack Angola while we have other problems with the country."
namibia.20.a:0 "LOCK IN"

namibia.21.t:0 "Moroccan Exciles"
namibia.21.d:0 "Ahmed al-Hiba, Abd el-Krim and Merri Rebbu have all surpisingly found themselves in Namibia. Following all of their defeats by the 1920's, these men fled Angola for refuge and were then invited to Namibia by Adolf Uunona. Due to their world-famous status of masters of guerilla warfare, Uunona first attempted to recruit these men into the army, but they all refused, citing their goals to be Moroccan liberations, not some Namibian wet dream of conquering South Africa. They all fell out with Uunona since, but have attended the congresss due to their popularity and love from Africans all across the globe. The three talked about the lives of Africans before European colonisation. Not too long ago Morocco and many other African nations like Wadai and Libya were free too. This has all came to end, and most of Africa has become subjugated to Europeans. Al-Hiba still mementoes of the past in the Sahara with his father, Ma al'-aynayn, a land unknonw to Europeans and pure from the coloniser's touch. Their examples of their not-so-perfect but free lives mimics life in Namibia. Although our economy may be in the gutter, and we may all be living dirt-poor, we live with the knowledge that we are free. We are Africans ruled by Africans, not by Europeans, or ghastly, by the French. A thunderous round of apolause was given to the three as they left the podium..."
namibia.21.a:0 "Do I know them from somewhere?"

namibia.22.t:0 "African Americans"
namibia.22.d:0 "The African-American problem has been a thorn to the Pan-African Socialist philosophy since it's inception. Uunona calls for the liberation of Africa alone, while overseas figures like Marcus Garvery call for the liberation of African-Americans aswell. They are in no doubt brothers to the African people, taken away from their homes centuries prior, but the ambition of including them in a Pan-African nation seems too crazy to even Uunona, who's the same guy who think's he can single handly unite Africa! Garvey has called out Uunona's thoughts on African-Americans, using it to insult his ideology, calling Pan-African Socialism 'Nothing more than something created by Uunona while he was smoking the green'. Safe to say he won't be attending next year's congress, that's for sure!"
namibia.22.a:0 "Mad-Lad"


namibia.25.t:0 "Uunona's Successor"
namibia.25.d:0 "The recent months have been a hellhole for Uunona's public reputation. The endless war and poorly made decisions has made his advisors agree that it would be the best for the SWAPO party if he resigned his position. This will cause a grave amount of chaos in the country, that's no doubt, but it is starting to look like the SWAPO needs someone stronger and younger than Uunona if we wish to continue."
namibia.25.a:0 "Erwin Osas Rommel, the Minister of Defence Must Take Power!"
namibia.25.b:0 "Dressler Must Lead the Party!"
namibia.25.c:0 "Hendrik Samuel Witbooi has Great Political Connections and a United Namibia is What we Need in These Dire Times!"
############


NMB_export_the_wealth_of_namibia:0 "Export the Wealth of Namibia"
NMB_export_the_wealth_of_namibia_desc:0 "An open market economy that lets the wealth of Namibia be exported to the world will let our economy grow rapidly."

NMB_market_socialsim:0 "Namibian Market Socialism"
NMB_market_socialsim_desc:0 "We cannot fall victim to the greed of capitalism while proclaiming ourselves as a state for the workers. We will let the doors go free while maintaining a watchful eye over the economy."

NMB_reconcile_with_the_capitalist:0 "Reconcile with the Capitalist"
NMB_reconcile_with_the_capitalist_desc:0 "Maybe abandoning all economic trades with our African and overseas parters wasn't the wises of ideas. We will re-establish trade with our neighbours to up the flow of cash."

NMB_infratructure_investments:0 "Infrastructure Investments"
NMB_infratructure_investments_desc:0 "Our roads are miserable and all of our rail has been destroyed as a result of the war, with no one in the government looking to fix it. Luckly for us, there's foreigners out there willing to build all this fancy stuff for us... For a price that is, atleast."

NMB_foreign_workforces:0 "Foreign Brains"
NMB_foreign_workforces_desc:0 "The foreigners are much more technologically advance than us. We could learn a thing or two from their bright minds."

NMB_arms_industry:0 "Domestic Arms Market"
NMB_arms_industry_desc:0 "Nations like Germany and Italy made lots of money by producing high quality weapons for those who couldn't affor their own. With Africa boiling in anger, we too could make some money by selling weapons to rebel groups across the continent"

NMB_tourism:0 "Tourism"
NMB_tourism_desc:0 "Namibia's beauty goes unmatched. We will make quite a bit of money by welcoming in European tourists and travelers."

NMB_civilian_investments:0 "Civilian Investments"
NMB_civilian_investments_desc:0 "Investors are seeing the future our great nation has. It's time to welcome in more and more businessmen!"

NMB_invest_in_the_arms_industry:0 "Invest in the Arms Industry"
NMB_invest_in_the_arms_industry_desc:0 "The investors could also benefit from sinking their teeth into our army."

NMB_take_on_debts:0 "Take on Debts"
NMB_take_on_debts_desc:0 "Namibia has many World War Era debts that we still havent payed back to Germany. Refusing to pay these denies us a good trading partner and sends a message that Namibia is unreliable when it comes to paying back it's IOUs. We will begin paying Germany back this debt to show the world how serious Namibia's economy is."

NMB_bolster_agricultural_exports:0 "Bolster Agricultural Exports"
NMB_bolster_agricultural_exports_desc:0 "Most of Namibia's population engages in agriculture. Why don't we try to squeeze some money out of them?"

NMB_export_namibia_wealth:0 "Foreign Excavation"
NMB_export_namibia_wealth_desc:0 "Namibia's resources are just ready to be excavated at any moment!"

NMB_second_diamond_rush:0 "Second Diamond Rush"
NMB_second_diamond_rush_desc:0 "Everyone and their mother is dying to chase after South African gold and diamonds. Namibia too has similiar wealth awaiting to be unearthed by novice prospectors"

NMB_sell_off_namibian_companies:0 "Sell Off Namibian Companies"
NMB_sell_off_namibian_companies_desc:0 "The foreigners have filled in the shoes of local Namibian companies. We will sell these businesses out to help reduce our debt, while granting the foreigners greater control over the economy."

NMB_seek_investments_in_companies:0 "Seek Investments in Companies"
NMB_seek_investments_in_companies_desc:0 "Local Namibian businesses deserve attention too. Investing in them will provide us with great rewards."

NMB_sell_off_oil:0 "Otjozondjupa Oil"
NMB_sell_off_oil_desc:0 "The north is full of oil waiting to be sold to the foreigners!"

NMB_uranium_industry:0 "Uranium Fever"
NMB_uranium_industry_desc:0 "Namibia is home to some of the largest Uranium reserves in the world. We must start digging to one day create wonderweapons of our own! Oh, and the money would be nice..."

NMB_costs_of_war:0 "Costs of War"
NMB_costs_of_war_desc:0 "As the war goes on, our trade routes collapse and partners turn against us. Our moment of luxury blinded us and our nation is falling into a great deficite. We must either find new ways to make money, or to greatly cut down on our army's size."

NMB_take_more_from_the_home_front:0 "Take More From the Home Front"
NMB_take_more_from_the_home_front_desc:0 "The greedy children demanding free lunches while the Namibian war machine is starving in the battle field! We must take and ration more from the people to prevent a total collapse in the field."

NMB_cut_on_weapon_production:0 "Cut Down on Weapon Design"
NMB_cut_on_weapon_production_desc:0 "We need to spend less on the army. Building cheaper and less functional weapons will help with that."

NMB_scrap_submarines:0 "Scrap Submarines"
NMB_scrap_submarines_desc:0 "Our uboats are costly while making no changes in the war. We will melt them down for scrap metal, and we'll gut it for spare cash."

NMB_find_new_trade_partners:0 "Find new Trade Partners"
NMB_find_new_trade_partners_desc:0 "With us being unable to trade with France or England, nations like Ecuador or Chile have turned into the last nations we can trade with."

NMB_beg_for_debt_forgiveness:0 "Beg for Debt Forgiveness"

NMB_socialist_oligarchs:0 "Socialist Oligarchs"
NMB_socialist_oligarchs_desc:0 "We may be called a Socialist country, but we're riddled to the bone with a dirty case of capitalism. We must appease the businessmen  that rule over our economy."


NMB_german_army_veto:0 "German Veto"
NMB_german_army_veto_desc:0 "Many German veterans that used to operate in what was German Sudtwestafrika now operate for us. Their skills are undeniable, but they have also unfortunately snuck themselves into our politics, boycotting Hitler has his most needed moments, and causing violence in our other-wise stable government."

NMB_legacy_of_segregartion:0 "Legacy of Segregation"
NMB_legacy_of_segregartion_desc:0 "Although Hitler's abolishment of the Segregation Policies were suppose to be enacted in 1936, no real actions have been acted upon to stop Segregation, causing many Africans to feel betrayed by Hitler."

NMB_anglo_problem:0 "Anglo Problem"
NMB_anglo_problem_desc:0 "The occupation of Namibia may of only lasted from 1916 to 1921, but thousands of British settlers have already built homes and small communities in Namibia, causing a headache for our other-wise majority Black population."

NMB_german_support_low:0 "Low German Support"
NMB_german_support_low_desc:0 "The German population that arrived when Germany colonised Namibia remains a mark on our nation's demographics. They are too few in numbers to be ignored, but too plentiful to just kick them all out of the country."

NMB_child_labour:0 "Child Labour"
NMB_child_labour_desc:0 "The devistating effects of the Great War of Resistance Against the Western Imperialist caused most of the adult population to be dead or too injured to work. This resultes in countless children taking the jobs of their parentings, working in factories instead of working in schools."

NMB_workers1:0 "Dead Economy"
NMB_workers1_desc:0 "The death of Namibia's prestige in 1916, and a decade to follow it resulted in most of our economy to end up in ruins or barely functioning. Not to mention the long history of worker abuse and oligarchs have resulted in working conditions to be some of the worse Africa has seen. Hitler will have to pull of a miracle if he wants the gears of war to roar once more against South Africa and the West..."

NMB_workers2:0 "Dead Economy"
NMB_workers2_desc:0 "The death of Namibia's prestige in 1916, and a decade to follow it resulted in most of our economy to end up in ruins or barely functioning. Not to mention the long history of worker abuse and oligarchs have resulted in working conditions to be some of the worse Africa has seen. Hitler will have to pull of a miracle if he wants the gears of war to roar once more against South Africa and the West..."

