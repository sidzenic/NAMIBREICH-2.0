NMB_export_the_wealth_of_namibia:0 "Export the Wealth of Namibia"
NMB_export_the_wealth_of_namibia_desc:0 "An open market economy that lets the wealth of Namibia be exported to the world will let our economy grow rapidly."

NMB_market_socialsim:0 "Namibian Market Socialism"
NMB_market_socialsim_desc:0 "We cannot fall victim to the greed of capitalism while proclaiming ourselves as a state for the workers. We will let the doors go free while maintaining a watchful eye over the economy."

NMB_reconcile_with_the_capitalist:0 "Reconcile with the Capitalist"
NMB_reconcile_with_the_capitalist_desc:0 "Maybe abandoning all economic trades with our African and overseas parters wasn't the wises of ideas. We will re-establish trade with our neighbours to up the flow of cash."

NMB_infratructure_investments:0 "Infrastructure Investments"
NMB_infratructure_investments_desc:0 "Our roads are miserable and all of our rail has been destroyed as a result of the war, with no one in the government looking to fix it. Luckly for us, there's foreigners out there willing to build all this fancy stuff for us... For a price that is, atleast."

NMB_foreign_workforces:0 "Foreign Brains"
NMB_foreign_workforces_desc:0 "The foreigners are much more technologically advance than us. We could learn a thing or two from their bright minds."

NMB_arms_industry:0 "Domestic Arms Market"
NMB_arms_industry_desc:0 "Nations like Germany and Italy made lots of money by producing high quality weapons for those who couldn't affor their own. With Africa boiling in anger, we too could make some money by selling weapons to rebel groups across the continent"

NMB_tourism:0 "Tourism"
NMB_tourism_desc:0 "Namibia's beauty goes unmatched. We will make quite a bit of money by welcoming in European tourists and travelers."

NMB_civilian_investments:0 "Civilian Investments"
NMB_civilian_investments_desc:0 "Investors are seeing the future our great nation has. It's time to welcome in more and more businessmen!"

NMB_invest_in_the_arms_industry:0 "Invest in the Arms Industry"
NMB_invest_in_the_arms_industry_desc:0 "The investors could also benefit from sinking their teeth into our army."

NMB_take_on_debts:0 "Take on Debts"
NMB_take_on_debts_desc:0 "Namibia has many World War Era debts that we still havent payed back to Germany. Refusing to pay these denies us a good trading partner and sends a message that Namibia is unreliable when it comes to paying back it's IOUs. We will begin paying Germany back this debt to show the world how serious Namibia's economy is."

NMB_bolster_agricultural_exports:0 "Bolster Agricultural Exports"
NMB_bolster_agricultural_exports_desc:0 "Most of Namibia's population engages in agriculture. Why don't we try to squeeze some money out of them?"

NMB_export_namibia_wealth:0 "Foreign Excavation"
NMB_export_namibia_wealth_desc:0 "Namibia's resources are just ready to be excavated at any moment!"

NMB_second_diamond_rush:0 "Second Diamond Rush"
NMB_second_diamond_rush_desc:0 "Everyone and their mother is dying to chase after South African gold and diamonds. Namibia too has similiar wealth awaiting to be unearthed by novice prospectors"

NMB_sell_off_namibian_companies:0 "Sell Off Namibian Companies"
NMB_sell_off_namibian_companies_desc:0 "The foreigners have filled in the shoes of local Namibian companies. We will sell these businesses out to help reduce our debt, while granting the foreigners greater control over the economy."

NMB_seek_investments_in_companies:0 "Seek Investments in Companies"
NMB_seek_investments_in_companies_desc:0 "Local Namibian businesses deserve attention too. Investing in them will provide us with great rewards."

NMB_sell_off_oil:0 "Otjozondjupa Oil"
NMB_sell_off_oil_desc:0 "The north is full of oil waiting to be sold to the foreigners!"

NMB_uranium_industry:0 "Uranium Fever"
NMB_uranium_industry_desc:0 "Namibia is home to some of the largest Uranium reserves in the world. We must start digging to one day create wonderweapons of our own! Oh, and the money would be nice..."

NMB_costs_of_war:0 "Costs of War"
NMB_costs_of_war_desc:0 "As the war goes on, our trade routes collapse and partners turn against us. Our moment of luxury blinded us and our nation is falling into a great deficite. We must either find new ways to make money, or to greatly cut down on our army's size."

NMB_take_more_from_the_home_front:0 "Take More From the Home Front"
NMB_take_more_from_the_home_front_desc:0 "The greedy children demanding free lunches while the Namibian war machine is starving in the battle field! We must take and ration more from the people to prevent a total collapse in the field."

NMB_cut_on_weapon_production:0 "Cut Down on Weapon Design"
NMB_cut_on_weapon_production_desc:0 "We need to spend less on the army. Building cheaper and less functional weapons will help with that."

NMB_scrap_submarines:0 "Scrap Submarines"
NMB_scrap_submarines_desc:0 "Our uboats are costly while making no changes in the war. We will melt them down for scrap metal, and we'll gut it for spare cash."

NMB_find_new_trade_partners:0 "Find new Trade Partners"
NMB_find_new_trade_partners_desc:0 "With us being unable to trade with France or England, nations like Ecuador or Chile have turned into the last nations we can trade with."

NMB_beg_for_debt_forgiveness:0 "Beg for Debt Forgiveness"

NMB_socialist_oligarchs:0 "Socialist Oligarchs"
NMB_socialist_oligarchs_desc:0 "We may be called a Socialist country, but we're riddled to the bone with a dirty case of capitalism. We must appease the businessmen  that rule over our economy."


NMB_german_army_veto:0 "German Veto"
NMB_german_army_veto_desc:0 "Many German veterans that used to operate in what was German Sudtwestafrika now operate for us. Their skills are undeniable, but they have also unfortunately snuck themselves into our politics, boycotting Hitler has his most needed moments, and causing violence in our other-wise stable government."

NMB_legacy_of_segregartion:0 "Legacy of Segregation"
NMB_legacy_of_segregartion_desc:0 "Although Hitler's abolishment of the Segregation Policies were suppose to be enacted in 1936, no real actions have been acted upon to stop Segregation, causing many Africans to feel betrayed by Hitler."

NMB_anglo_problem:0 "Anglo Problem"
NMB_anglo_problem_desc:0 "The occupation of Namibia may of only lasted from 1916 to 1921, but thousands of British settlers have already built homes and small communities in Namibia, causing a headache for our other-wise majority Black population."

NMB_german_support_low:0 "Low German Support"
NMB_german_support_low_desc:0 "The German population that arrived when Germany colonised Namibia remains a mark on our nation's demographics. They are too few in numbers to be ignored, but too plentiful to just kick them all out of the country."

NMB_child_labour:0 "Child Labour"
NMB_child_labour_desc:0 "The devistating effects of the Great War of Resistance Against the Western Imperialist caused most of the adult population to be dead or too injured to work. This resultes in countless children taking the jobs of their parentings, working in factories instead of working in schools."

NMB_workers1:0 "Dead Economy"
NMB_workers1_desc:0 "The death of Namibia's prestige in 1916, and a decade to follow it resulted in most of our economy to end up in ruins or barely functioning. Not to mention the long history of worker abuse and oligarchs have resulted in working conditions to be some of the worse Africa has seen. Hitler will have to pull of a miracle if he wants the gears of war to roar once more against South Africa and the West..."

NMB_workers2:0 "Dead Economy"
NMB_workers2_desc:0 "The death of Namibia's prestige in 1916, and a decade to follow it resulted in most of our economy to end up in ruins or barely functioning. Not to mention the long history of worker abuse and oligarchs have resulted in working conditions to be some of the worse Africa has seen. Hitler will have to pull of a miracle if he wants the gears of war to roar once more against South Africa and the West..."

