NMB_workers9:0 "A Roaring Economy"
NMB_workers9_desc:0 ""

NMB_workers10:0 "A Roaring Economy"
NMB_workers10_desc:0 ""

NMB_workers11:0 "A Roaring Economy"
NMB_workers11_desc:0 ""

NMB_defending_our_homeland:0 "Defending Namibia"
NMB_defending_our_homeland_desc:0 "Another great catastrophe cannot be placed upon us again! Every man and woman will defend Namibia to their heart's desire!"

lesotho_gold_deal:0 "Lesotho Gold"
lesotho_gold_deal_desc:0 " "

NMB_black_support6:0 "Support of the Natives"
NMB_black_support5:0 "Support of the Natives"
NMB_black_support4:0 "Support of the Natives"
NMB_black_support3:0 "Support of the Natives"
