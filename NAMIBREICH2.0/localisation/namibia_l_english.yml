uunona_hate_full:0 "Literally Worse Than Hitler"

uunona_love_half:0 "Big Support"
uunona_love_full:0 "Hero of Namibia"

namibia.24.t:0 "Ndilimeke Dressler Criticises Uunona"
namibia.24.d:0 "Look at this weak man you call the leader of Namibia. The economy has not made any progress in the 6 years he has been in power. Crime is rampant in Namibia, the children are in the mines, and even the homeless are somehow more broke than compaired in other countries! How could we let our glorious fatherland Namibia turn into such a trainreck? Well, Uunona allowed it of course! His' pseudo-socialism is nothing more than keys jangling infront of a toddler! He calls it socialism to spread an idea that he'll share the wealth of Namibia, but he hasn't! Not due to the fact that he's greedy, but because Namibia has no economy under his freakish rule! Bolshevikism is the true path for Namibia, ladies and gentlemen! You know it as well as I do. Uunona is weak, and we all know what happened to the Swakopmund Government..."
namibia.24.a:0 "We can't be bothered shutting him up"
namibia.24.b:0 "Silence!"

namibia.26.t:0 "Remeber the Goold Ol' Days? ~ Hosea Kutako"
namibia.26.d:0 "Not many of us can remember the days before the Kraut's washed up upon the shore of Namibia. Only us old-timers can recall such memories, locked away by decades of struggle and war. This struggle still continues today, with the Namibian people under the occupation of Uunona. Us old folk remeber a time before all of these disasters, and sadly we are a fading people. A time when Namibia was truely free from the occupation of the foreigners or itself. Uunona took a bright-futured Namibia and has turned it all the way around, with us going darkness we didn't even know existed anymore. The old Samuel Maherero did not struggle against the Germans for this. Myself did not resist the Germans so some radical could rule Namibia thereafter. Namibia is doomed and dying. This radical leftist regime isn't made for Africans. People like myself know what is good for Namibia, as I lived in the days where I saw what was good for Namibia. Before Uunona begins conquering our brothers to the East and South, remember that the first country Uunona conquered was Namibia."
namibia.26.a:0 "He's just a harmless old man..."
namibia.26.b:0 "Send him to the nursing home! Who let thise old geezer into politics?"

namibia.27.t:0 "Church Speaks Against Uunona"
namibia.27.d:0 "Uunona's policies against the church are unacceptable. With his wild dreams of turning Namibia into a pagan state and destroying Christianity, who can see him as a father of Namibia? The expulsion of Finnish missionaries are just a shining example of this. Instead of helpin the struggling Namibian peoples, he focuses on groups and minorities he holds grudges against. If he is willing to do this to the largest religious group in the country, what will he do to, lets say, ethnic minorities or white minorities in the future? We are all followers of Christ in Namibia. We should care for one another as followers of God."
namibia.27.a:0 "Bro what"
namibia.27.b:0 "How about we illegalise your cute little faith!"

namibia.23.t:0 "End of the Congress"
namibia.23.d:0 "The 36 Pan-Afrcan Congress has ended. The delegators have returned home after a great big party where Uunona was seen twerking and grooving on the dance floor while the DJ played Sudwesterlied."
namibia.23.a:0 "Great Success!"

namibia.28.t:0 "Namibia Demands we Renounce our Claim on Zambia"
namibia.28.d:0 "Our supposed great ally of Uunona has demanded we renounce our rightful claims on Zambia and insists on us both joining the African Axis. If we accept these demands, it will be a great humiliation for Bentu M'slei"
namibia.28.a:0 "If it's for the betterment of Africa..."
namibia.28.b:0 "Traitorous Dog! Zambia is Zimbabwe!"

namibia.29.t:0 "The Call to All Africans"
namibia.29.d:0 "TODAY IS THE DAY AFRICA IS FREE. EVERY MAN AND WOMEN OF AFRICA, TAKE UP ARMS! LIBERATION AWAITS!"
namibia.29.d:0 "Europe's reign of tyranny ends!"

namibia_news.4.t:0 "The Great African Revolution"
namibia_news.4.d:0 "Sparked by decades and even centuries of oppression, slavery, genocide, and neglect, millions of Africans in the West African Colonies have revolted against their European masters. They have all sworn an oath to the liberation of Africa, and the death of the colonial era. Uunona's ideas of a liberated Africa don't look too crazy after all."
namibia_news.4.a:0 "Has Africa Finally Been Served Justice?"

africa_37.1.t:0 "1937 Offical Pan-African Congress"
africa_37.1.d:0 "The fourth Pan-African Congress is going to take place. Africa has drastically changed in this past year. Namibia licking the wounds of it's economic depression, peace on the Zambezi and the Abyssinian War continuing to ravenge on. Lets see what we can expect from this year"
africa_37.1.a:0 "Long Live a United Africa"

africa_37.2.t:0 "The South African Pan-African Socialist Party"
africa_37.2.d:0 "Members of the South African Pan-African Socialist Party have arrived to Windhoek. The members snuck themsleves into Botswana, then into Namibia to attend this meeting. Members spoke about the praise and glory the Namibian army would receive from the Black community in South Africa should war break out. The say they're 'eagerly waiting' to colaborate with the Namibian government should war break out."
africa_37.2.a:0 "South Africa Deserves Freedom!"

africa_37.3.t:0 "The Congo Liberation Army"
africa_37.3.d:0 "During the Great War, the Congo had it's own great revolution against France and Belgium. Often labeled as the 'Congo War' or 'African Great War', the Congo would somehow end up even worse economically with even harsher Belgian control over them. Today there still exists an in-excile government on the Zambian border. They still dream about an independent Congo free from Belgian clutches. Although they are very anti-leftist, the growing power of Namibia has forced them to change their mind about us and Zimbabwe. They have sent generals and officers to Windhoek to talk about the chance of us three nations working together in the future against the Belgians."
africa_37.3.a:0 "The Congo Shall be Free!"

namibia.32.t:0 "Yakov's Escape"
namibia.32.d:0 "Yakov Alksnis is a Russian-Latvian fighter and was a high ranking member in the Soviet Airforce and is an aviational invetor, along with being a self proclaimed genius. It is quite odd to find a Soviet Commander and his journey here is quite a story. Uunona was and has been deeply interested in creating a great airforce... Or to atleast give it a go. Uunona took a deep fascination with Alksnis' fighter designer and requested for him to travel to Namibia to showcase his fighter design. Alksnis took himself and his family to Namibia in 1935 to showcase the fighters but agressivly refused to departure back to the Soviet Union. Increasd skepticism and hate towards Latvians in the Soviet Union made him fear for the worse towards his and his family's safety. This fear and refusal to return has turned into a little fairytale Namibia miracle. We have the brains to create an airforce, but in what world would we be ruling the skies? "
namibia.32.a:0 "Namibia Shall Have It's Place as an Aerial Superpower!"

NMB_africoin_idea:0 "AfriCoin"

stop_the_bad_event:0 "This Will Limit People Speaking Against Uunona"

NMB_help_zambia:0 "Demands to Zimbabwe"
NMB_help_zambia_desc:0 "Zambia would be a very  important ally and crucial partner in a future war with Belgium. However, Bentu M'seli currently claims all of Zambia as rightful Zimbabwean land, making it impossible to make the two work together. We will send some demands to M'seli to renounce his claims, and we will try to work with the two nations."

NMB_annex_angola:0 "Annex Angola"
NMB_annex_angola_desc:0 "Unfortunately Ndilimeke was correct. Angola is spineless and weak with it being only a matter of time before the cave into the Tana Entente, joining the war against us and ignoring our previous brotherly relationship. We must take the initiative and strike first!"

NMB_ally_angola:0 "Ally Angola"
NMB_ally_angola_desc:0 "This is the moment in history where all Pan-African Socialists struggle together against the West! Angola must join the war to defeat colonialism for once and for all!"

NMB_question_the_faithful:0 "1937 Pan-African Congress"
NMB_question_the_faithful_desc:0 "It's time for the annual Pan-African Congress of 1937 to take place!"

NMB_limit_christian_missions:0 "1939 Pan-African Congress"
NMB_limit_christian_missions_desc:0 "Perhapse the last Pan-African Congress, we must all unite in this trying time!"

NMB_state_paganism:0 "Africoin"
NMB_state_paganism_desc:0 "Africa will have to unite under a single currency we want to remain economically connected. We will ask the African nations to adopt this new currency to help us all."

NMB_fund_pagan_schools:0 "Continental Schooling"
NMB_fund_pagan_schools_desc:0 "It's our duty to educate the people of Africa!"

NMB_namibia_under_my_belt:0 "Africa Under my Control!"
NMB_namibia_under_my_belt_desc:0 "Africa's time to free itself is now! We will call to the African People to rebel against their masters!"

